name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest -v
      - name: Smoke-test against a real crashing unit on this Linux runner
        run: |
          sudo tee /etc/systemd/system/crashloop-smoke.service > /dev/null <<'EOF'
          [Unit]
          Description=Deliberately crashing smoke-test service
          StartLimitIntervalSec=10
          StartLimitBurst=3

          [Service]
          ExecStart=/bin/false
          Restart=always
          RestartSec=100ms
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start crashloop-smoke.service || true
          sleep 3
          sudo systemctl status crashloop-smoke.service || true
          systemd-crashloop --version
          systemd-crashloop --help
          systemd-crashloop crashloop-smoke.service --json > /tmp/report.json || true
          python -m json.tool < /tmp/report.json
          grep -q "start_limit_hit\|nonzero_exit" /tmp/report.json
          sudo systemctl stop crashloop-smoke.service || true
          sudo rm -f /etc/systemd/system/crashloop-smoke.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed crashloop-smoke.service || true

  build-artifact:
    name: Build .pyz + sdist/wheel and smoke-test on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build a standalone .pyz (zipapp)
        run: |
          python -m pip install . --target build/pyz_root
          printf 'from systemd_crashloop.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz_root/__main__.py
          python -m zipapp build/pyz_root \
            --output dist/systemd-crashloop.pyz \
            --python "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/systemd-crashloop.pyz --version
          python3 dist/systemd-crashloop.pyz --json > /tmp/scl.json || true
          python3 -m json.tool < /tmp/scl.json > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result, not always be 0 (zipapp's --main template
          # omits sys.exit(), which previously made every .pyz invocation
          # report success regardless of actual findings/errors). Diagnosing
          # a definitely-nonexistent unit name is a deterministic nonzero
          # (unit-not-found -> exit 3) case.
          set +e
          python3 dist/systemd-crashloop.pyz definitely-nonexistent-unit-xyz.service > /dev/null 2>&1
          bogus_code=$?
          set -e
          test "$bogus_code" -eq 3
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
